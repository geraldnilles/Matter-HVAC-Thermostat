<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="houseBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c3e50" />
      <stop offset="100%" stop-color="#1a252f" />
    </linearGradient>

    <linearGradient id="fireGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#e67e22" />
      <stop offset="50%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#f1c40f" />
    </linearGradient>

    <linearGradient id="frostGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3498db" />
      <stop offset="100%" stop-color="#00d2ff" />
    </linearGradient>
    
    <radialGradient id="screenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34495e" stop-opacity="1" />
      <stop offset="100%" stop-color="#2c3e50" stop-opacity="1" />
    </radialGradient>

    <g id="snowflake-branch">
      <line x1="0" y1="0" x2="0" y2="-52" />
      <path d="M-13,-36 L0,-45 L13,-36" fill="none" />
      <path d="M-9,-18 L0,-25 L9,-18" fill="none" />
    </g>
  </defs>

  <path d="M256,30 L450,190 L450,450 L62,450 L62,190 Z" fill="url(#houseBg)" stroke="#ecf0f1" stroke-width="16" stroke-linejoin="round" />
  
  <path d="M30,195 L256,15 L482,195" fill="none" stroke="#ecf0f1" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />

  <circle cx="256" cy="300" r="110" fill="url(#screenGlow)" stroke="#7f8c8d" stroke-width="6" />
  <circle cx="256" cy="300" r="95" fill="none" stroke="#bdc3c7" stroke-width="4" stroke-dasharray="2,12" opacity="0.4" />

  <text x="252" y="322" font-family="system-ui, -apple-system, sans-serif" font-size="100" font-weight="bold" fill="#ffffff" text-anchor="middle">72</text>
  <text x="306" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="70" font-weight="bold" fill="#ffffff">°</text>

  <g transform="translate(125, 300) scale(1.75)">
    <path d="M-25,10 C-25,25 -15,35 0,35 C15,35 25,25 25,10 C25,-10 5,-25 0,-40 C-5,-25 -25,-10 -25,10 Z" fill="url(#fireGrad)" />
    <path d="M-13,13 C-13,22 -7,28 0,28 C7,28 13,22 13,13 C13,0 3,-10 0,-20 C-3,-10 -13,0 -13,13 Z" fill="#f39c12" opacity="0.8" />
  </g>

  <g transform="translate(385, 300)" stroke="url(#frostGrad)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="0" cy="0" r="6" fill="url(#frostGrad)" stroke="none" />
    
    <use href="#snowflake-branch" transform="rotate(0)" />
    <use href="#snowflake-branch" transform="rotate(60)" />
    <use href="#snowflake-branch" transform="rotate(120)" />
    <use href="#snowflake-branch" transform="rotate(180)" />
    <use href="#snowflake-branch" transform="rotate(240)" />
    <use href="#snowflake-branch" transform="rotate(300)" />

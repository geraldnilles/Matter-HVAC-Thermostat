<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img">
<title>Thermostat</title>
<desc>Dark thermostat dial — rounded square tile with blue arc, 72° readout and status LED</desc>
<!-- Tile -->
<rect width="100" height="100" rx="22" fill="#121212"/>
<!-- Hairline keyline — visible on light browser tabs -->
<rect x="0.7" y="0.7" width="98.6" height="98.6" rx="21.3" fill="none" stroke="#3A4150" stroke-width="1.45" opacity="0.92"/>
<!-- Bezel -->
<circle cx="50" cy="50.6" r="33.4" fill="#1E2228" stroke="#353C45" stroke-width="2.45"/>
<!-- Tick ring (subtle) -->
<circle cx="50" cy="50.6" r="30.15" fill="none" stroke="#3A414D" stroke-width="1.35" stroke-linecap="butt" stroke-dasharray="1.05 11.6" opacity="0.28" transform="rotate(-7.5 50 50.6)"/>
<!-- Active arc — 270 deg, round caps, Material Blue 500 -->
<circle cx="50" cy="50.6" r="30" fill="none" stroke="#2196F3" stroke-width="4.65" stroke-linecap="round" stroke-dasharray="141.4 47.1" transform="rotate(-90 50 50.6)"/>
<!-- Inner face -->
<circle cx="50" cy="50.6" r="26.05" fill="#121417"/>
<circle cx="50" cy="50.6" r="26.05" fill="none" stroke="white" stroke-width="0.9" opacity="0.055"/>
<!-- Status LED -->
<circle cx="50" cy="17.25" r="3.75" fill="#2196F3" stroke="#0F1115" stroke-width="1.3"/>
<circle cx="50" cy="17" r="1.2" fill="white" opacity="0.94"/>
<!-- Temperature -->
<text x="49.1" y="62.1" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="33" font-weight="800" letter-spacing="-0.9" fill="#F2F4F8" text-rendering="geometricPrecision">72</text>
<!-- Degree mark — vector shape for crisp scaling at 16px -->
<circle cx="68.9" cy="43.65" r="2.85" fill="none" stroke="#F2F4F8" stroke-width="1.6" stroke-linecap="round"/>
</svg>

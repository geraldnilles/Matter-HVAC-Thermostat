<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Rounded square background -->
  <rect width="100" height="100" rx="22" fill="#121212" />
  <!-- Outer ring -->
  <circle cx="50" cy="50" r="34" fill="#1e1e1e" stroke="#4a4a4a" stroke-width="3"/>
  <circle cx="50" cy="50" r="30" fill="none" stroke="#2196F3" stroke-width="4" stroke-linecap="round" stroke-dasharray="140 60" transform="rotate(-90 50 50)"/>
  <!-- Temperature text -->
  <text x="50" y="58" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="700" fill="#ffffff">72°</text>
  <!-- Small indicator dot -->
  <circle cx="50" cy="18" r="4" fill="#2196F3"/>
</svg>
